[package]
name = "citadel-internal-service-connector"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
websockets = ["dep:tokio-tungstenite", "dep:tungstenite", "dep:futures-util", "dep:tokio-rustls"]
js = ["uuid/js"]
vendored = ["citadel_sdk/vendored"]

[dependencies]
citadel-internal-service-types = { workspace = true }
intersession-layer-messaging = { workspace = true, features = ["testing"] }
bincode2 = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
futures = { workspace = true, features = ["alloc"] }
uuid = { workspace = true }
async-trait = "0.1.79"
dashmap = { workspace = true }
parking_lot = { workspace = true }
itertools = { workspace = true }
bytes = "1.8.0"
citadel_logging = { workspace = true }
# The `log` FACADE, distinct from citadel_logging above, which wraps tracing.
# messenger/mod.rs does `use citadel_logging as log`, so every `log::info!` in
# that file is a tracing macro needing a subscriber — and the WASM client
# installs only `console_log`, a `log`-facade logger. The result was that every
# diagnostic in that file was invisible in the browser while ILM's lines (which
# use the real facade) came through, which read like the code never running.
log = { version = "0.4", default-features = false }
citadel_sdk = { workspace = true, optional = true }

# WebSocket dependencies
tokio-tungstenite = { version = "0.21", optional = true }
# TLS on the loopback listener (io_interface/tls.rs). rustls, not OpenSSL: the vendored
# OpenSSL the release links is for the SDK; this listener wants no second copy of it.
# `ring`, explicitly: tokio-rustls 0.26 defaults to aws-lc-rs, and the rest of the graph
# (citadel_wire) is on ring -- one provider, not two, and `crypto::ring` must exist.
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12", "logging"] }
tungstenite = { version = "0.21", optional = true }
futures-util = { version = "0.3", optional = true }

# WASM dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
citadel_io = { workspace = true, default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasmtimer = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
citadel_io = { workspace = true, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
citadel_crypt = { workspace = true }
citadel-internal-service-test-common = { workspace = true }
citadel_io = { workspace = true, features = ["std"] }

[dev-dependencies]
# Self-signed certificates for the TLS listener tests; already in the graph via citadel_wire.
rcgen = "0.14"
rand = "0.8.5"
tokio = { workspace = true, features = ["full"] }
env_logger = "0.10"

[[example]]
name = "websocket_json_demo"
required-features = ["websockets"]

[[example]]
name = "websocket_server"
required-features = ["websockets"]
