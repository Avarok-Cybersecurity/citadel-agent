[package]
name = "citadel-internal-service-types"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
typescript = ["ts-rs", "citadel-app-sdk-types/ts"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
citadel_types = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
citadel-internal-service-macros = { workspace = true }
custom_debug = { workspace = true }
# The guest ABI's types this wire carries unchanged (`app_session::SessionStatus`). no_std.
citadel-app-sdk-types = { path = "../citadel-app-sdk-types" }
# Recovery codes are wiped when dropped (src/sign_in.rs). Already in the tree through the SDK.
zeroize = "1.8"

# TypeScript bindings
ts-rs = { version = "11", optional = true, features = [
    "serde-compat",
    "uuid-impl",
    "bytes-impl",
    "chrono-impl",
]}

[build-dependencies]
# CITADEL_TYPES_HASH (build_types_hash.rs). Already in the lock via the SDK.
sha3 = "0.10"

[dev-dependencies]
serde_json = "1.0"
