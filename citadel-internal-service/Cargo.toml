[package]
name = "citadel-internal-service"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
vendored = ["citadel_sdk/vendored"]
websockets = ["citadel-internal-service-connector/websockets"]
js = ["uuid/js"]
# Enable native file picker dialog support (for PickFile request)
# Only enable when building for native desktop (not in Docker/server)
native-dialogs = ["rfd"]
# Enable parking_lot deadlock detection for debugging lock contention
deadlock-detection = []

[dependencies]
citadel_sdk = { workspace = true, features=["multi-threaded"] }
# `ErrorCode`: which failed reconnects are refusals (kernel/reconnect/policy.rs).
citadel_io = { workspace = true }
# The keep-alive constants that bound how long a server holds a dead session
# (kernel/reconnect/policy.rs), from the SDK rather than copied.
citadel_proto = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "macros"] }
bincode2 = { workspace = true }
citadel-internal-service-types = { workspace = true }
# Every ILM codec natively, brotli included: a native messenger has no module
# size to protect, and peers use only the codecs both sides advertise. This is
# also what compiles the connector's codec-gated tests in a workspace build,
# now that the WASM client no longer turns brotli on.
citadel-internal-service-connector = { workspace = true, features = ["compression-brotli", "compression-deflate", "compression-zstd"] }
futures = { workspace = true }
uuid = { workspace = true, features = [
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]}
bytes = { workspace = true }
# OS randomness for session attach tokens (kernel/attach_tokens.rs). Already in
# the tree through the SDK; declared for direct use.
getrandom = "0.3"
# The account ILM the agent hosts (kernel/ilm): the same crate the browser's
# messenger runs, so frames and stored state are identical.
intersession-layer-messaging = { workspace = true }
async-trait = { workspace = true }
async-recursion = { workspace = true }
# Optional: native file picker dialog (requires desktop environment)
rfd = { workspace = true, optional = true }
# Synchronous RwLock to prevent holding locks across await points
parking_lot = { workspace = true }

# Unix-only: effective-uid lookup for verifying ownership of the
# browser-transfer temp root (CWE-377 hardening). Already in the
# dependency tree transitively; declared here for direct use.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# A replica of the legacy wire enum, to prove an older peer can read every frame.
serde = { workspace = true }
citadel_sdk = { workspace = true, features=["multi-threaded", "localhost-testing"] }
citadel-internal-service-test-common = { workspace = true }