[package]
name = "citadel-vfs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The virtual filesystem's model, canonical op codec, reducer, permission function, derived views and migration passes."

# No `workspace = true` keys, as in citadel-identity: the kernel, the agent and the browser wasm
# client depend on this crate by path and must not need this workspace's other members.
#
# Pure and wasm32-unknown-unknown clean: nothing here draws randomness, reads a clock or does I/O.
# Time, ids and randomness are the caller's arguments.
[dependencies]
citadel-identity = { path = "../citadel-identity", version = "0.1.0" }
# The version and features citadel-identity uses, for the one ML-DSA-65 verification an op and a
# claim need (vfs-signing.md §1).
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "zeroize"] }
sha3 = "0.10"
serde = { version = "1.0", features = ["derive"] }
# NFC (Unicode 17.0.0), the version vfs-model.md §6 pins.
unicode-normalization = "=0.1.25"

[dev-dependencies]
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
